<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hunter Mafia — Web O'yin</title>
<meta name="theme-color" content="#0b0709">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0709; --bg2:#140c10; --card:#1b1117; --card2:#241820; --line:#3a2530;
  --txt:#f1e7e3; --mut:#a8938f; --red:#c8243b; --red2:#8f1428; --gold:#d6a74a; --gold2:#f0cd7c;
  --blue:#3b82f6; --green:#34c77b; --night:#6a8cff; --day:#ffb84a; --vote:#7fd6ff;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative}
.hide{display:none!important}

/* ---------- header ---------- */
#hdr{flex:none;display:flex;align-items:center;gap:10px;padding:9px 12px;background:linear-gradient(180deg,#1a0d12,#120a0e);border-bottom:1px solid var(--line);position:relative;z-index:6}
#hdr .ph{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.06em;font-size:15px;text-transform:uppercase}
#hdr .ph .ic{font-size:20px}
#hdr .sub{font-size:12px;color:var(--mut);font-weight:500;letter-spacing:0;text-transform:none}
#hdr .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600}
.ibtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);font-size:16px}
.ibtn.on{border-color:var(--gold);color:var(--gold2)}
body[data-ph=night] #hdr{background:linear-gradient(180deg,#0e1330,#0a0d22)}
body[data-ph=night] #hdr .ph{color:var(--night)}
body[data-ph=day] #hdr .ph{color:var(--day)}
body[data-ph=vote] #hdr .ph{color:var(--vote)}

/* ---------- tabs ---------- */
#tabs{flex:none;display:flex;background:var(--bg2);border-bottom:1px solid var(--line);position:relative;z-index:5}
#tabs button{flex:1;padding:10px 4px;font-weight:700;font-size:13px;color:var(--mut);position:relative;letter-spacing:.03em}
#tabs button.on{color:var(--txt)}
#tabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--red)}
.badge{position:absolute;top:5px;right:calc(50% - 38px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}

/* ---------- main ---------- */
#main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.pane{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.pane.on{display:flex}

/* stage */
#stage{flex:none;height:46%;min-height:240px;position:relative;z-index:0;isolation:isolate;background:radial-gradient(120% 100% at 50% 0%,#1a0f16,#0b0709);overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#lbls{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sl{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:auto;will-change:transform}
.sl .nm{max-width:var(--nmw,86px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:700;padding:2px 7px 2px 5px;border-radius:9px;background:rgba(14,8,11,.82);border:1px solid #4a2c38;color:#f1e7e3;display:flex;gap:4px;align-items:center}
.sl .nm b{font-size:10px;color:var(--gold2);font-weight:800}
.sl.me .nm{background:rgba(20,50,110,.9);border-color:#4f8bff}
.sl.mate .nm{background:rgba(120,14,30,.92);border-color:#ff4d63}
.sl.dead .nm{opacity:.55;text-decoration:line-through}
.sl.pick .nm{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(240,205,124,.45)}
.sl.sel .nm{background:var(--gold);color:#1b1006;border-color:#fff}
.sl .vt{margin-top:2px;font-size:11px;font-weight:800;padding:1px 7px;border-radius:8px;background:var(--vote);color:#05222f}
.sl .rl{font-size:15px;line-height:1;margin-bottom:1px;filter:drop-shadow(0 1px 2px #000)}
.sl .av2{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;border:2px solid rgba(255,255,255,.25);margin-bottom:2px;box-shadow:0 2px 8px #0008}
.sl.dead .av2{filter:grayscale(1) brightness(.6)}
.sl.pick .av2{border-color:var(--gold2)}
.sl.sel .av2{border-color:#fff;box-shadow:0 0 14px var(--gold)}
.sl.me .av2{border-color:#4f8bff}
.sl.mate .av2{border-color:#ff4d63}
#spk{position:absolute;left:8px;top:8px;z-index:3;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:60%}
#spk .c{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:rgba(10,40,24,.85);border:1px solid #3fcf7a;color:#c9ffe0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#bMic{display:none}#bMic.show{display:grid}
#bMic.on{border-color:#3fcf7a;color:#8dffb8}#bMic.live{background:#14663a;box-shadow:0 0 0 3px rgba(63,207,122,.35);animation:mp 1s ease-in-out infinite}#bMic.dis{opacity:.45}
@keyframes mp{50%{box-shadow:0 0 0 6px rgba(63,207,122,.1)}}
.sl.talk .nm{border-color:#3fcf7a;box-shadow:0 0 0 2px rgba(63,207,122,.5)}
.sl.talk .av2{border-color:#3fcf7a;box-shadow:0 0 12px #3fcf7a}
#camBtns{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:3}
#camBtns .ibtn{width:32px;height:32px;font-size:14px;background:rgba(20,12,16,.8)}
#pickBar{position:absolute;left:8px;right:8px;bottom:8px;z-index:4;display:none;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(27,17,23,.96);border:1px solid var(--gold)}
#pickBar.on{display:flex}
#pickBar .t{flex:1;font-size:13px}
.btn{padding:9px 14px;border-radius:11px;font-weight:700;font-size:14px;background:var(--card2);border:1px solid var(--line)}
.btn.red{background:linear-gradient(180deg,#d12a42,#9b1a30);border-color:#e0536a;color:#fff}
.btn.gold{background:linear-gradient(180deg,#e2b85c,#b98a2e);border-color:#f0cd7c;color:#1b1006}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}

/* feed */
#feedWrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
#feedTitle{flex:none;padding:7px 12px;font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
#feed{flex:1;overflow-y:auto;padding:10px 10px 14px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.fc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:14px;line-height:1.4;word-break:break-word;animation:pop .25s ease}
.fc.sys{background:transparent;border:0;text-align:center;color:var(--mut);font-size:12px;padding:2px}
.fc.pv{background:linear-gradient(135deg,#142038,#101a2e);border-color:#2b4a85}
.fc.pv::before{content:"🔒 ";opacity:.8}
.fc.scene{padding:0;overflow:hidden;border-color:#4b2a3a}
.fc.scene .sh{display:flex;align-items:center;gap:10px;padding:10px 12px;font-weight:800;letter-spacing:.04em}
.fc.scene.nt .sh{background:linear-gradient(90deg,#10173c,#171e50);color:#9db4ff}
.fc.scene.dy .sh{background:linear-gradient(90deg,#4a2f10,#6b4515);color:#ffd48a}
.fc.scene .sb{padding:8px 12px 10px}
.fc .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fc .btns .btn{padding:7px 12px;font-size:13px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#newMsg{position:absolute;right:12px;bottom:10px;display:none;padding:7px 12px;border-radius:999px;background:var(--red);font-weight:700;font-size:12px;box-shadow:0 4px 12px #0008}

/* chat */
.chat{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:84%;padding:7px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;word-break:break-word;align-self:flex-start}
.msg .who{font-size:11px;font-weight:800;color:var(--gold2);margin-bottom:1px}
.msg.mine{align-self:flex-end;background:#2a1520;border-color:#5a2a3a}
.msg.sysm{align-self:center;background:transparent;border:0;color:var(--mut);font-size:12px}
.msg.team .who{color:#ff7a8c}
.chatbar{flex:none;display:flex;gap:8px;padding:8px 10px calc(8px + var(--safe-b));background:var(--bg2);border-top:1px solid var(--line)}
.chatbar input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:15px;outline:none;user-select:text;-webkit-user-select:text}
.chatbar input:focus{border-color:var(--red)}
.chatbar .closed{flex:1;text-align:center;color:var(--mut);font-size:13px;padding:10px}

/* bottom role panel */
#bot{flex:none;display:flex;align-items:center;gap:12px;padding:9px 12px calc(9px + var(--safe-b));background:linear-gradient(0deg,#1a0d12,#140b10);border-top:1px solid var(--line);position:relative;z-index:6}
#bot .rtx{flex:1;min-width:0}
#bot .rn{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
#bot .rd{font-size:12px;color:var(--mut);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.infob{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold2);font-size:12px;font-weight:800;display:grid;place-items:center}
#ring{position:relative;width:52px;height:52px;flex:none}
#ring svg{width:52px;height:52px;transform:rotate(-90deg)}
#ring .tm{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:14px}
#ring circle{fill:none;stroke-width:5}
#ring .bgc{stroke:#33222b}
#ring .fgc{stroke:var(--red);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
body[data-ph=night] #ring .fgc{stroke:var(--night)}
body[data-ph=day] #ring .fgc{stroke:var(--day)}
body[data-ph=vote] #ring .fgc{stroke:var(--vote)}

/* prompt sheet */
#prm{position:absolute;left:0;right:0;bottom:0;z-index:7;max-height:62%;overflow-y:auto;background:linear-gradient(180deg,#201219,#190e14);border-top:2px solid var(--gold);border-radius:18px 18px 0 0;padding:12px 12px 12px;box-shadow:0 -10px 30px #000a;transform:translateY(110%);transition:transform .28s ease}
#prm.on{transform:none}
#prm .ph{width:38px;height:4px;border-radius:2px;background:#4a3a40;margin:0 auto 10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.pc .px{font-size:14px;margin-bottom:8px}
.pc .pb{display:flex;flex-wrap:wrap;gap:6px}
.pc .pb .btn{padding:8px 12px;font-size:13px}
.pc .plist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:6px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.chip.on{background:var(--gold);color:#1b1006;border-color:#fff}
#prmFab{position:absolute;right:12px;bottom:92px;z-index:6;display:none}
#prmFab.on{display:flex}
#prmFab .btn{box-shadow:0 6px 18px #000a;animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(200,36,59,.25),0 6px 18px #000a}}

/* sheets / overlays */
.ov{position:absolute;inset:0;z-index:20;background:rgba(5,2,4,.72);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:82%;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--safe-b))}
.sheet h3{margin:0 0 8px;font-size:18px}
.sheet .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #2a1a22}
.sheet .row:last-child{border:0}
.sheet .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px}
.sheet p{color:var(--mut);margin:6px 0}

/* lobby */
#lobby{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;padding:14px 14px 22px;gap:12px;background:radial-gradient(100% 60% at 50% 0%,#2a1018,#0b0709 70%)}
#lobby.on{display:flex}
.lbTop{display:flex;align-items:center;gap:14px}
#lbRing{position:relative;width:96px;height:96px;flex:none}
#lbRing svg{width:96px;height:96px;transform:rotate(-90deg)}
#lbRing circle{fill:none;stroke-width:7}
#lbRing .tm{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:20px;line-height:1.1}
#lbRing .tm small{display:block;font-size:10px;color:var(--mut);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.lbInfo h2{margin:0;font-size:20px}
.lbInfo .mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.pl{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;text-align:center}
.pl .dot{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:21px;color:#fff;border:2px solid rgba(255,255,255,.2);box-shadow:0 4px 12px #0008}
.pl.me .dot{border-color:#4f8bff}
.pl .n{max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.panel h4{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 .btn{flex:1;min-width:120px}
#lbChat{height:160px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2)}

/* result */
#res{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;overflow-y:auto;padding:18px 14px 24px;background:radial-gradient(100% 50% at 50% 0%,#3a1220,#0b0709 75%);gap:12px}
#res.on{display:flex}
#res .big{text-align:center;font-size:26px;font-weight:900;letter-spacing:.04em}
#res .big small{display:block;font-size:13px;color:var(--mut);font-weight:500;letter-spacing:0;margin-top:4px}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.rrow.w{border-color:var(--gold);background:linear-gradient(90deg,#2a1f0c,var(--card))}
.rrow .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.rrow .r{margin-left:auto;font-size:13px;color:var(--mut);text-align:right}

#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:50;max-width:90%;padding:10px 14px;border-radius:12px;background:rgba(30,18,24,.97);border:1px solid var(--gold);font-size:14px;text-align:center;display:none;box-shadow:0 8px 24px #000a}
#toast.on{display:block;animation:pop .2s}
#snd{position:absolute;left:12px;right:12px;top:64px;z-index:30;display:none;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--gold);align-items:center;gap:10px}
#snd.on{display:flex}
#boot{position:absolute;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);text-align:center;padding:24px}
#boot .lg{font-size:44px;margin-bottom:10px}
#boot .tt{font-weight:800;letter-spacing:.1em;font-size:18px}
#boot .ms{color:var(--mut);margin-top:8px;font-size:14px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #3a2530;border-top-color:var(--red);margin:16px auto 0;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body data-ph="boot">
<div id="app">

  <div id="hdr">
    <div class="ph"><span class="ic" id="hIc">🎯</span><div><div id="hPh">HUNTER MAFIA</div><div class="sub" id="hSub"></div></div></div>
    <div class="sp"></div>
    <span class="pill" id="hSpec" title="">👁 <span id="hSpecN">0</span></span>
    <button class="ibtn" id="bSnd" aria-label="sound">🔊</button>
    <button class="ibtn" id="bLang" aria-label="lang">UZ</button>
  </div>

  <div id="tabs" class="hide">
    <button data-tab="game" class="on"><span data-i="tGame">O'yin</span></button>
    <button data-tab="chat"><span data-i="tChat">Chat</span><span class="badge hide" id="bdChat">0</span></button>
    <button data-tab="team" class="hide"><span id="tTeamL">Mafiya</span><span class="badge hide" id="bdTeam">0</span></button>
    <button data-tab="dead" class="hide"><span data-i="tDead">O'liklar</span><span class="badge hide" id="bdDead">0</span></button>
  </div>

  <div id="main">
    <!-- LOBBY -->
    <div id="lobby">
      <div class="lbTop">
        <div id="lbRing">
          <svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" stroke="#33222b"/><circle id="lbFg" cx="48" cy="48" r="42" stroke="#c8243b" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="0" style="transition:stroke-dashoffset .9s linear"/></svg>
          <div class="tm"><div><span id="lbT">0:00</span><small data-i="lbStart">Boshlanish</small></div></div>
        </div>
        <div class="lbInfo">
          <h2 id="lbTitle">Hunter Mafia</h2>
          <div class="mut"><span data-i="lbRoom">Xona</span> <b id="lbRoom">#</b> · <b id="lbCnt">0/0</b></div>
          <div class="mut" id="lbNeed"></div>
        </div>
      </div>
      <div class="panel hide" id="lbAdmin">
        <h4 data-i="lbAdmin">Admin paneli</h4>
        <div class="row2">
          <button class="btn red" id="bStart" data-i="lbNow">Hozir boshlash</button>
          <button class="btn" id="bCancel" data-i="lbCancel">Bekor qilish</button>
        </div>
      </div>
      <div class="panel">
        <h4 data-i="lbPlayers">Ishtirokchilar</h4>
        <div class="grid" id="lbGrid"></div>
      </div>
      <div class="row2">
        <button class="btn gold" id="bJoin" data-i="lbJoin">Qo'shilish</button>
        <button class="btn" id="bLeave" data-i="lbLeave">Ro'yxatdan chiqish</button>
      </div>
      <div class="panel">
        <h4 data-i="tChat">Chat</h4>
        <div id="lbChat"><div class="chat" id="lbMsgs"></div>
          <div class="chatbar"><input id="lbIn" maxlength="300" data-ph="msgPh" placeholder="Xabar..."><button class="btn red" id="lbSend">➤</button></div></div>
      </div>
      <div class="panel" id="lbPrev" style="display:none"></div>
    </div>

    <!-- GAME: tab game -->
    <div class="pane on" id="pgame">
      <div id="stage">
        <canvas id="cv"></canvas>
        <div id="spk"></div>
        <div id="lbls"></div>
        <div id="camBtns">
          <button class="ibtn" id="bCam" title="camera">🎥</button>
          <button class="ibtn" id="bEco" title="eco">⚡</button>
          <button class="ibtn" id="bMic" title="mic">🎙</button>
          <button class="ibtn" id="bPl" title="players">👥</button>
        </div>
        <div id="pickBar"><div class="t" id="pickT"></div><button class="btn ghost" id="pickNo" data-i="cancel">Bekor</button><button class="btn red" id="pickOk" data-i="confirm">Tasdiqlash</button></div>
      </div>
      <div id="feedWrap">
        <div id="feedTitle"><span data-i="feedT">O'yin lentasi</span></div>
        <div id="feed"></div>
        <button id="newMsg" data-i="newMsg">Yangi xabarlar ↓</button>
      </div>
    </div>

    <div class="pane" id="pchat">
      <div class="chat" id="chatBox"></div>
      <div class="chatbar" id="chatBar"><input id="chatIn" maxlength="300" data-ph="msgPh" placeholder="Xabar..."><button class="btn red" id="chatSend">➤</button></div>
    </div>
    <div class="pane" id="pteam">
      <div class="chat" id="teamBox"></div>
      <div class="chatbar" id="teamBar"><input id="teamIn" maxlength="300" data-ph="msgPh" placeholder="Xabar..."><button class="btn red" id="teamSend">➤</button></div>
    </div>

window.Audio2=(function(){
  const W=()=>window.__WG;
  let unlocked=false,muted=false,q=[],cur=null,bgmEl=null,bgmUrl=null,seen=new Set(),hasAudio=false,asked=false,timer=null;
  try{muted=localStorage.getItem('wg_mute')==='1'}catch(e){}
  const API=(window.WG_API||location.origin).replace(/\/$/,'');
  const full=u=>/^https?:/.test(u)?u:API+u;
  function updBtn(){const b=document.getElementById('bSnd');if(!b)return;b.textContent=muted?'🔇':'🔊';b.classList.toggle('on',!muted&&unlocked)}
  function unlock(){
    if(unlocked)return;
    unlocked=true;document.getElementById('snd').classList.remove('on');
    try{const a=new Audio();a.muted=true;a.play&&a.play().catch(()=>{})}catch(e){}
    if(bgmEl&&!muted)bgmEl.play().catch(()=>{});
    schedule();updBtn();
  }
  function maybeAsk(){
    if(asked||unlocked||muted||!hasAudio)return;
    asked=true;document.getElementById('snd').classList.add('on');
  }
  function duck(on){if(bgmEl)bgmEl.volume=on?0.08:0.22}
  function schedule(){
    clearTimeout(timer);
    if(!unlocked||muted||cur)return;
    const now=W().serverNow();
    while(q.length&&q[0].at+q[0].dur<now-1.2)q.shift();
    if(!q.length)return;
    const n=q[0];
    if(n.at>now+0.15){timer=setTimeout(schedule,Math.min(2000,(n.at-now)*1000));return}
    q.shift();
    try{
      const a=new Audio(full(n.url));a.preload='auto';a.volume=1;cur=a;duck(true);
      const done=()=>{if(cur===a){cur=null;duck(false);schedule()}};
      a.onended=done;a.onerror=done;
      a.play().catch(()=>{cur=null;duck(false)});
    }catch(e){cur=null}
  }
  function feed(list){
    for(const v of list||[]){if(seen.has(v.id))continue;seen.add(v.id);hasAudio=true;q.push(v)}
    q.sort((a,b)=>a.at-b.at);schedule();maybeAsk();
  }
  function bgm(b){
    if(b)hasAudio=true;
    const url=b?b.url:null;
    if(url===bgmUrl)return;
    bgmUrl=url;
    if(bgmEl){try{bgmEl.pause()}catch(e){}bgmEl=null}
    if(!url)return;
    try{
      bgmEl=new Audio(full(url));bgmEl.loop=true;bgmEl.volume=cur?0.08:0.22;
      if(unlocked&&!muted)bgmEl.play().catch(()=>{});
    }catch(e){}
  }
  function toggle(){
    muted=!muted;try{localStorage.setItem('wg_mute',muted?'1':'0')}catch(e){}
    if(muted){try{cur&&cur.pause()}catch(e){}cur=null;if(bgmEl)bgmEl.pause()}
    else{unlock();if(bgmEl)bgmEl.play().catch(()=>{});schedule()}
    updBtn();
  }
  document.addEventListener('pointerdown',()=>{if(!muted)unlock()},{once:false,passive:true});
  document.addEventListener('DOMContentLoaded',()=>{
    updBtn();
    document.getElementById('bSnd').onclick=e=>{e.stopPropagation();toggle()};
    document.getElementById('sndOn').onclick=e=>{e.stopPropagation();muted=false;try{localStorage.setItem('wg_mute','0')}catch(x){}unlock()};
    document.getElementById('sndNo').onclick=e=>{e.stopPropagation();document.getElementById('snd').classList.remove('on');asked=true};
  });
  return {unlock,feed,bgm,maybeAsk,toggle};
})();

  function update(v,S){

  function ensureMode(){

  }
  async function setMode(m,persist){
    if(m!=='hi'&&m!=='lite'&&m!=='2d')m='hi';

    mode=(m==='2d')?'2d':'3d';if(persist)W().store.set('wg_mode',m);

      }

    if(mode==='2d'&&QM!=='2d')QM='2d';
    $('bEco').textContent=QI[QM]||'🎮';$('bEco').classList.toggle('on',QM!=='hi');
    applyQ();ensureMode();resize();if(V){sync();place2d()}
  }

  /* ---------- 2D joylashtirish ---------- */
  function place2d(){
    if(mode==='3d'&&THREEok)return;
    const st=$('stage'),w=st.clientWidth,h=st.clientHeight;if(!w||!h)return;
    const N=lbls.size;const sc=N>18?.6:(N>12?.74:(N>8?.86:1));
    const cx=w/2,cy=h*.5,rx=w*.41,ry=h*.35;
    $('lbls').style.setProperty('--nmw',(N>12?58:(N>8?68:84))+'px');

      const x=cx+Math.cos(l.th)*rx,y=cy+Math.sin(l.th)*ry;
      l.el.style.left=x+'px';l.el.style.top=(y+22*sc)+'px';
      l.el.style.transform='translate(-50%,-100%) scale('+sc+')';
      l.el.style.zIndex=String(Math.round(y));

  }

  /* ---------- 3D kadr ---------- */
  function frame(ts){
    raf=requestAnimationFrame(frame);
    if(!(mode==='3d'&&THREEok&&renderer)||document.hidden)return;
    if(LITE()&&ts-lastRender<30)return;
    lastRender=ts;
    const dt=Math.min(.06,(ts-lastT)/1000||.016);lastT=ts;const t=ts/1000;
    fpsAcc+=dt;fpsN++;
    if(fpsN>=120){
      const avg=fpsAcc/fpsN;fpsAcc=0;fpsN=0;
      if(Q==='hi'&&avg>1/24){setMode('lite',true);W().toast(W().t('autoLite'),3500)}
      else if(Q==='lite'&&avg>1/13&&!window.__ecoHint){window.__ecoHint=1;W().toast(W().t('autoEco'),4500)}
    }
    // yoritish
    if(tgt){
      const k=Math.min(1,dt*2.2);
      cur.bg.lerp(new THREE.Color(tgt.bg),k);cur.amb.lerp(new THREE.Color(tgt.amb),k);cur.dir.lerp(new THREE.Color(tgt.dir),k);
      cur.ai+=(tgt.ai-cur.ai)*k;cur.di+=(tgt.di-cur.di)*k;cur.cand+=(tgt.cand-cur.cand)*k;cur.moon+=(tgt.moon-cur.moon)*k;
      scene.background.copy(cur.bg);scene.fog.color.copy(cur.bg);amb.color.copy(cur.amb);amb.intensity=cur.ai;
      dir.color.copy(cur.dir);dir.intensity=cur.di;
      const fl=1+Math.sin(t*9)*.08+Math.sin(t*23)*.05;
      candleA.intensity=cur.cand*(LITE()?1.5:1)*fl;if(!LITE())candleB.intensity=cur.cand*(2-fl);
      moon.material.opacity=cur.moon*.85;

    }
    // personajlar
    chars.forEach(c=>{
      const dd=c.dead+((c.target||0)-c.dead)*Math.min(1,dt*3);c.dead=dd;
      c.up.rotation.x=dd*.85+(1-dd)*(Math.sin(t*1.4+c.ph)*.012);
      c.head.rotation.y=(1-dd)*Math.sin(t*.6+c.ph)*.22;
      c.head.rotation.x=dd*.5;
      c.up.position.y=.5-dd*.06+(1-dd)*Math.sin(t*1.5+c.ph)*.005;
      if(c.lastD!==Math.round(dd*20)){c.lastD=Math.round(dd*20);setDeadLook(c,dd)}
      const tk=talkSet.has(c.u)&&dd<.5?1:0;c.talk+=(tk-c.talk)*Math.min(1,dt*10);
      c.mouth.scale.y=1+c.talk*(1.2+Math.abs(Math.sin(t*13+c.ph))*5);
      c.up.rotation.z=c.talk*Math.sin(t*4.5+c.ph)*.025;
      c.tring.visible=c.talk>.05;if(c.tring.visible){c.tring.scale.setScalar(1+Math.sin(t*8)*.05);c.tring.material.opacity=.25+.6*c.talk}
      if(c.ring.visible){c.ring.scale.setScalar(1+Math.sin(t*5)*.06+(c.sel?.12:0));c.ring.material.color.set(c.sel?0xffffff:0xf0cd7c)}
    });
    if(!LITE())tableG.children.forEach(o=>{if(o.userData.flame){o.scale.y=1.4+Math.sin(t*11+o.position.x*9)*.25}});
    if(!LITE()){dust.rotation.y=t*.01;dust.position.y=Math.sin(t*.2)*.1}
    // kamera
    yaw+=(yawT-yaw)*Math.min(1,dt*6);
    if(!drag)yawT*=Math.pow(.6,dt*2);
    const me=V&&V.me.in?chars.get(V.me.u):null;
    const cmode=(camMode!=='top'&&me)?camMode:'top';
    const cw=$('stage').clientWidth,ch=$('stage').clientHeight;
    let tp,tl,tf;
    if(cmode==='1st'){const a=me.th+yaw*.25;tp=[Math.cos(a)*3.45,1.95,Math.sin(a)*3.45];tl=[0,.95,0];tf=64}
    else if(cmode==='3rd'){const a=me.th+yaw*.35;tp=[Math.cos(a)*5.6,3.1,Math.sin(a)*5.6];tl=[0,1.0,0];tf=cw/ch<1?66:52}
    else{const a=Math.PI/2+yaw+Math.sin(t*.12)*.05;tp=[Math.cos(a)*10.2,8.6,Math.sin(a)*10.2];tl=[0,.7,0];tf=cw/ch<1?58:46}
    if(!cp){cp=new THREE.Vector3(tp[0],tp[1],tp[2]);cl=new THREE.Vector3(tl[0],tl[1],tl[2]);cf=tf}
    const ck=Math.min(1,dt*4.5);
    cp.x+=(tp[0]-cp.x)*ck;cp.y+=(tp[1]-cp.y)*ck;cp.z+=(tp[2]-cp.z)*ck;
    cl.x+=(tl[0]-cl.x)*ck;cl.y+=(tl[1]-cl.y)*ck;cl.z+=(tl[2]-cl.z)*ck;
    cf+=(tf-cf)*ck;
    camera.position.copy(cp);camera.lookAt(cl);
    if(Math.abs(camera.fov-cf)>.05){camera.fov=cf;camera.updateProjectionMatrix()}
    renderer.render(scene,camera);
    // yorliqlar
    const w=$('stage').clientWidth,h=$('stage').clientHeight;const vv=new THREE.Vector3();
    lbls.forEach((l,u)=>{
      const c=chars.get(u);if(!c){return}
      vv.set(c.x,2.12-c.dead*.5,c.z).project(camera);
      if(vv.z>1||(camMode==='1st'&&V&&me&&u===V.me.u)){l.el.style.display='none';return}
      l.el.style.display='';
      l.el.style.left=((vv.x*.5+.5)*w)+'px';l.el.style.top=((-vv.y*.5+.5)*h)+'px';
      l.el.style.transform='translate(-50%,-100%)';l.el.style.zIndex=String(Math.round(1000-vv.z*500));
    });
  }

        const rc=new THREE.Raycaster();rc.setFromCamera(ndc,camera);
        const hits=rc.intersectObjects([...chars.values()].map(c=>c.hit),false);
        if(hits.length){for(const [u,c] of chars){if(c.hit===hits[0].object){if(window.__onSeatTap)window.__onSeatTap(u);break}}}

      $('bEco').onclick=()=>{const o=['hi','lite','2d'];const n=o[(o.indexOf(QM)+1)%3];W().hap();setMode(n,true).then(()=>W().toast(W().t(n==='hi'?'qHi':(n==='lite'?'qLite':'q2d')),1500))};
    }
    const saved=W().store.get('wg_mode');

    const touch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
    setMode(saved||(low?'2d':(touch?'lite':'hi')),false).then(()=>{lastT=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)});
  }
  function stop(){running=false;cancelAnimationFrame(raf)}
  return {start,stop,update,resize,setMode,setTalking};
})();

let pulling=false,again=false,es=null,esT=null;
async function pull(){
  if(S.gone)return;
  if(pulling){again=true;return}
  pulling=true;
  try{const v=await getState();apply(v)}catch(e){}
  pulling=false;
  if(again){again=false;pull()}
}
function openSSE(){
  try{if(es)es.close()}catch(e){}
  if(!window.EventSource||S.gone)return;
  try{
    es=new EventSource(API+'/api/wg/stream?c='+CHAT+'&init_data='+encodeURIComponent(INIT));
    es.onmessage=()=>pull();
    es.addEventListener('gone',()=>{try{es.close()}catch(e){}});
    es.onerror=()=>{try{es.close()}catch(e){};clearTimeout(esT);esT=setTimeout(openSSE,3500)};
  }catch(e){}

function apply(v){
  if(!v||!v.ok){
    if(!S.V){$('bootMsg').textContent=t('gone');$('bootSp').classList.add('hide');}
    S.gone=true;try{es&&es.close()}catch(e){}
    return;
  }
  S.skew=v.now*1000-Date.now();
  const first=!S.V;
  S.V=v;
  // lenta
  for(const it of v.feed){S.feed.set('f'+it.i,it);if(it.i>S.fs)S.fs=it.i}
  for(const it of (v.live||[])){S.feed.set('f'+it.i,it)}
  // live bo'lmagan, lekin tugmasi olib tashlanganlar
  S.feed.forEach((it,k)=>{if(it.b&&!(v.live||[]).some(l=>l.i===it.i)&&it.i<=v.fl){delete it.b}});
  S.notes=new Map();for(const n of v.notes){S.notes.set('n'+n.i,n)}
  if(v.fl>S.fs)S.fs=v.fl;
  // chatlar
  const addc=(arr,items,key)=>{let n=0;for(const m of items){if(!arr.some(x=>x.i===m.i)){arr.push(m);n++}}if(arr.length>200)arr.splice(0,arr.length-200);
    return n};
  const nc=addc(S.chat,v.chat),nt=addc(S.team,v.team),nd=addc(S.dead,v.dead);
  if(v.cl>S.cs)S.cs=v.cl;if(v.tl>S.ts)S.ts=v.tl;if(v.dl>S.ds)S.ds=v.dl;
  if(!first){
    if(nc&&S.tab!=='chat'&&!(isLobby()))S.unread.chat+=nc;
    if(nt&&S.tab!=='team')S.unread.team+=nt;
    if(nd&&S.tab!=='dead')S.unread.dead+=nd;
  }
  // ovoz
  if(v.vl>S.vs){Audio2.feed(v.voice);S.vs=v.vl}
  Audio2.bgm(v.bgm);
  for(const x of v.toast||[]){toast(x.x,x.a?4200:2600)}
  render(first);
  if(first){$('boot').classList.add('hide');Audio2.maybeAsk()}
}

function phaseKey(v){
  if(v.phase==='waiting')return 'lobby';
  if(v.phase==='starting')return 'start';
  if(v.phase==='ended')return 'end';
  if(v.phase==='night')return 'night';
  if(v.phase==='day')return v.voting?'vote':'day';
  return 'start';
}
function render(first){
  const v=S.V;if(!v)return;

  document.body.dataset.ph=pk==='lobby'?'lobby':pk;

  const lob=pk==='lobby';
  $('lobby').classList.toggle('on',lob);
  $('tabs').classList.toggle('hide',lob);
  $('bot').classList.toggle('hide',lob);
  document.querySelectorAll('.pane').forEach(p=>p.style.visibility=lob?'hidden':'');

  else{
    Stage.start();
    renderTabs(v);renderBottom(v,pk);renderFeed(v);renderChats(v);renderPrompts(v);Stage.update(v,S);renderPick();

}

function tickTimers(){
  const v=S.V;if(!v)return;
  const now=serverNow();
  if(v.phase==='waiting'){
    const rem=Math.max(0,Math.ceil(v.lobby.end-now));
    $('lbT').textContent=Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0');
    const key='lb'+Math.round(v.lobby.end);
    if(S.tot.key!==key){S.tot={key,dur:Math.max(rem,30)}}
    $('lbFg').style.strokeDashoffset=String(264*(1-Math.min(1,rem/S.tot.dur)));
    return;
  }
  const dl=v.deadline;
  if(!dl||v.phase==='ended'||v.phase==='starting'){$('rgT').textContent='—';$('rgFg').style.strokeDashoffset='0';return}
  const rem=Math.max(0,dl-now);
  const key=v.phase+':'+v.day+':'+v.night+':'+(v.sub||'')+':'+Math.round(dl);
  if(S.tot.key!==key){S.tot={key,dur:Math.max(rem,1)}}
  $('rgT').textContent=Math.ceil(rem);
  $('rgFg').style.strokeDashoffset=String(138.2*(1-Math.min(1,rem/S.tot.dur)));
}

const RE_NIGHT=/^\s*🌙\s*<b>\s*\d+-tun/i,RE_DAY=/^\s*☀️?\s*<b>\s*\d+-kun/i;
let lastFeedSig='';
function renderFeed(v){
  const all=[];
  S.feed.forEach(it=>all.push({k:'f'+it.i,t:it.t,o:it.i*2,it}));
  S.notes.forEach((n,k)=>all.push({k,t:n.t,o:n.i*2+1,note:n}));
  all.sort((a,b)=>a.t-b.t||a.o-b.o);
  const list=all.slice(-160);
  const canAct=v.me.in&&v.me.alive;
  const sig=list.map(a=>a.k+(a.it&&a.it.b?'b'+a.it.b.map(r=>r.map(x=>x.t).join()).join():'')+(a.it?a.it.x.length:'')).join('|')+canAct;
  if(sig===lastFeedSig)return;
  lastFeedSig=sig;
  const box=$('feed');
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<90;
  const frag=document.createDocumentFragment();
  for(const a of list){
    const d=document.createElement('div');
    if(a.note){d.className='fc pv';d.innerHTML=a.note.x;frag.appendChild(d);continue}
    const it=a.it;
    if(it.k==='sys'){d.className='fc sys';d.innerHTML=it.x}
    else{
      const isN=RE_NIGHT.test(it.x),isD=RE_DAY.test(it.x);
      if(isN||isD){
        d.className='fc scene '+(isN?'nt':'dy');
        const parts=it.x.split('\n');const head=parts.shift();
        d.innerHTML='<div class="sh"><span style="font-size:22px">'+(isN?'🌙':'☀️')+'</span><span>'+head.replace(/^\s*[🌙☀️]+\s*/u,'')+'</span></div>'+(parts.length?'<div class="sb">'+parts.join('<br>')+'</div>':'');
      }else{d.className='fc';d.innerHTML=it.x.replace(/\n/g,'<br>')}
      if(it.b&&canAct){
        const bw=document.createElement('div');bw.className='btns';
        for(const row of it.b)for(const b of row){
          const bt=document.createElement('button');bt.className='btn';bt.textContent=b.t;
          bt.onclick=()=>doAct(it.mid,b.d);bw.appendChild(bt)
        }
        d.appendChild(bw);
      }
    }
    frag.appendChild(d);
  }
  box.innerHTML='';box.appendChild(frag);
  if(near||!S.fedOnce){box.scrollTop=box.scrollHeight;S.fedOnce=true;$('newMsg').style.display='none'}
  else $('newMsg').style.display='block';
}
$('feed').addEventListener('scroll',()=>{const b=$('feed');if(b.scrollHeight-b.scrollTop-b.clientHeight<60)$('newMsg').style.display='none'});
$('newMsg').onclick=()=>{const b=$('feed');b.scrollTop=b.scrollHeight;$('newMsg').style.display='none'};

function drawMsgs(box,arr,me,team){
  const sig=arr.length+':'+(arr.length?arr[arr.length-1].i:0)+':'+box.id;
  if(box.dataset.sig===sig)return;box.dataset.sig=sig;
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  box.innerHTML='';
  for(const m of arr.slice(-120)){
    const d=document.createElement('div');d.className='msg'+(m.u===me?' mine':'')+(team?' team':'');
    const w=document.createElement('div');w.className='who';w.textContent=m.n;
    const x=document.createElement('div');x.textContent=m.x;
    d.append(w,x);box.appendChild(d);
  }
  if(near)box.scrollTop=box.scrollHeight;
}

  if(v.me.goal){const p2=document.createElement('p');p2.style.color='var(--gold2)';p2.textContent=v.me.goal;sh.appendChild(p2)}

      const s=document.createElement('div');s.textContent=m.a?'🟢':'💀';r.append(d,n,s);sh.appendChild(r)}
  }
  openOv('ovInfo');
};
$('bPl').onclick=()=>{
  const v=S.V;if(!v)return;
  const sh=$('shList');sh.innerHTML='';
  const h=document.createElement('h3');h.textContent=t('players')+' ('+v.players.length+')';sh.appendChild(h);
  for(const p of v.players){
    const r=document.createElement('div');r.className='row';
    const d=document.createElement('div');d.className='dot';d.style.background=col(p.u);d.textContent=ini(p.n);
    const n=document.createElement('div');n.style.flex='1';

    if(!p.a)n.style.opacity='.55';

    r.append(d,n,s);sh.appendChild(r);
  }
  openOv('ovList');
};

/* ---------------- natija ---------------- */
function renderResult(v){
  const r=v.result||{};
  const box=$('res');
  if(S.over&&S.resSig===JSON.stringify(r)){return}
  S.resSig=JSON.stringify(r);

  sect(t('winners'),w,true);sect(t('others'),o,false);

  const b2=document.createElement('button');b2.className='btn';b2.textContent=t('close');b2.onclick=()=>{try{TG&&TG.close()}catch(e){};S.resClosed=true;box.classList.remove('on')};
  bw.append(b1,b2);box.appendChild(bw);
  box.classList.add('on');S.over=true;
}

/* ---------------- tugmalar ---------------- */
$('bJoin').onclick=async()=>{hap('medium');Audio2.unlock();const r=await api('/api/wg/join');if(!r.ok)toast(r.error||t('error'));else toast(t('joined'),1400);pull()};
$('bLeave').onclick=async()=>{const r=await api('/api/wg/leave');if(!r.ok)toast(r.error||t('error'));pull()};
$('bStart').onclick=async()=>{const r=await api('/api/wg/start');if(!r.ok)toast(r.error||t('error'));pull()};
$('bCancel').onclick=async()=>{if(!confirm(t('askCancel')))return;const r=await api('/api/wg/cancel');if(!r.ok)toast(r.error||t('error'));pull()};
$('bLang').onclick=()=>{const L=Object.keys(I18N);LANG=L[(L.indexOf(LANG)+1)%L.length];store.set('wg_lang',LANG);applyI18n();if(S.V)render()};

/* ---------------- ishga tushirish ---------------- */
window.__WG={t,esc,col,ini,hap,toast,pull,S,serverNow,store,TG,$,INIT,CHAT,API};
applyI18n();
try{if(TG){TG.ready();TG.expand();TG.setHeaderColor&&TG.setHeaderColor('#120a0e');TG.setBackgroundColor&&TG.setBackgroundColor('#0b0709');TG.disableVerticalSwipes&&TG.disableVerticalSwipes()}}catch(e){}
async function showLobbies(){
  $('bootMsg').textContent='…';
  try{
    const r=await fetch(API+'/api/wg/lobbies?init_data='+encodeURIComponent(INIT));const d=await r.json();
    const box=$('bootMsg');box.innerHTML='';$('bootSp').classList.add('hide');
    if(d.mine){location.href='?c='+d.mine+location.hash;return}
    const items=d.items||[];
    if(!items.length){box.textContent=t('lobNone');return}
    for(const x of items){
      const b=document.createElement('button');b.className='btn '+(x.ph==='waiting'?'gold':'');b.style.cssText='display:block;width:100%;margin:8px 0;text-align:left';
      b.textContent=x.t+'  ·  '+x.n+'/'+x.max+'  ·  '+(x.ph==='waiting'?t('lbJoin'):t('watch'));
      b.onclick=()=>{location.href='?c='+x.c+location.hash};box.appendChild(b);
    }
  }catch(e){$('bootMsg').textContent=t('error')}
}
if(!INIT){
  $('bootMsg').textContent='Telegram ichida oching.';$('bootSp').classList.add('hide');
}else if(!CHAT){
  showLobbies();
}else{
  pull();openSSE();
  setInterval(()=>{if(!document.hidden)pull()},4000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){pull();openSSE()}});
}
})();
</script>
<script>
/* =====================================================================
   🎙 Jonli ovozli suhbat (WebRTC). Server faqat signaling qiladi (newfile_3.py),
   ovoz o'yinchilar o'rtasida to'g'ridan-to'g'ri (P2P) o'tadi.
   - Mikrofon tugmasi: yoqilsa, gapirganingizda avtomatik uzatiladi (VAD).
   - Faqat kunduzi va faqat tirik o'yinchilar gapiradi; tunda hamma ovoz yopiladi.
   - Har yo'nalish alohida ulanish: "out" (men gapiraman) / "in" (men tinglayman).
   ===================================================================== */
(function(){
'use strict';
const W=()=>window.__WG;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let ICE=[{urls:'stun:stun.l.google.com:19302'}];
let since=0,tv=-1,polling=false;
let can=false,ph='',peers=[],talk=new Set();
let armed=false,stream=null,track=null,vtrack=null,ac=null,an=null,buf=null,vadT=null,speaking=false,lastVoice=0,floor=.008,hb=0;
const outs=new Map(),ins=new Map(),auds=new Map(),retry=new Map();
const supported=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.RTCPeerConnection);

async function post(k,to,p){
  try{
    const w=W();
    const r=await fetch(w.API+'/api/wg/rtc',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({init_data:w.INIT,c:w.CHAT,to:to,k:k,p:p||{}})});
    return await r.json();
  }catch(e){return {ok:false}}
}

/* ---------- tinglash (in) ---------- */
function attach(f,st){
  let a=auds.get(f);
  if(!a){a=new Audio();a.autoplay=true;a.playsInline=true;auds.set(f,a)}
  a.srcObject=st;a.muted=false;a.volume=1;
  const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{});
}
function closeIn(f){
  const o=ins.get(f);if(o){try{o.pc.close()}catch(e){}ins.delete(f)}
  const a=auds.get(f);if(a){try{a.pause();a.srcObject=null}catch(e){}auds.delete(f)}
}
function closeAllIn(){for(const f of [...ins.keys()])closeIn(f)}
async function flushQ(o){
  const q=o.q.splice(0);
  for(const c of q){try{await o.pc.addIceCandidate(c)}catch(e){}}
}
async function onMsg(m){
  const f=m.f,p=m.p||{};
  try{
    if(m.k==='offer'){
      closeIn(f);
      const pc=new RTCPeerConnection({iceServers:ICE});
      const o={pc,q:[]};ins.set(f,o);
      pc.ontrack=e=>attach(f,(e.streams&&e.streams[0])||new MediaStream([e.track]));
      pc.onicecandidate=e=>{if(e.candidate)post('ice',f,{r:'r',c:e.candidate.toJSON()})};
      pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'||pc.connectionState==='closed'){if(ins.get(f)===o)closeIn(f)}};
      await pc.setRemoteDescription({type:'offer',sdp:p.sdp});
      await flushQ(o);
      const a=await pc.createAnswer();
      await pc.setLocalDescription(a);
      await post('answer',f,{type:'answer',sdp:pc.localDescription.sdp});
    }else if(m.k==='answer'){
      const o=outs.get(f);if(!o)return;
      await o.pc.setRemoteDescription({type:'answer',sdp:p.sdp});
      await flushQ(o);
    }else if(m.k==='ice'){
      const o=(p.r==='s')?ins.get(f):outs.get(f);
      if(!o||!p.c)return;
      if(o.pc.remoteDescription){try{await o.pc.addIceCandidate(p.c)}catch(e){}}
      else o.q.push(p.c);
    }
  }catch(e){}
}

/* ---------- gapirish (out) ---------- */
function closeOut(u){
  const o=outs.get(u);if(!o)return;
  try{o.pc.close()}catch(e){}
  outs.delete(u);
}
function closeAllOut(){for(const u of [...outs.keys()])closeOut(u)}
async function openOut(u){
  if(!track||!stream)return;
  const pc=new RTCPeerConnection({iceServers:ICE});
  const o={pc,q:[],t:Date.now()};outs.set(u,o);
  pc.addTrack(track,stream);
  pc.onicecandidate=e=>{if(e.candidate)post('ice',u,{r:'s',c:e.candidate.toJSON()})};
  pc.onconnectionstatechange=()=>{
    const s=pc.connectionState;
    if(s==='failed'||s==='closed'){if(outs.get(u)===o){retry.set(u,Date.now()+4000);closeOut(u)}}
    if(s==='connected'){try{const sd=pc.getSenders()[0];const pa=sd.getParameters();if(!pa.encodings||!pa.encodings.length)pa.encodings=[{}];pa.encodings[0].maxBitrate=28000;sd.setParameters(pa).catch(()=>{})}catch(e){}}
  };
  try{
    const of=await pc.createOffer();
    await pc.setLocalDescription(of);
    const r=await post('offer',u,{type:'offer',sdp:pc.localDescription.sdp});
    if(!r.ok){retry.set(u,Date.now()+5000);closeOut(u)}
  }catch(e){retry.set(u,Date.now()+5000);closeOut(u)}
}

/* ---------- mikrofon / VAD ---------- */
function vad(){
  if(!armed||!an)return;
  an.getFloatTimeDomainData(buf);
  let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
  const rms=Math.sqrt(s/buf.length),now=performance.now();
  if(!can){
    if(speaking){speaking=false;if(track)track.enabled=false}
    updBtn();return;
  }
  const thr=Math.max(.016,floor*3.4);
  if(rms>thr){
    lastVoice=now;
    if(!speaking){speaking=true;if(track)track.enabled=true;hb=now;post('talk',0,{});updBtn()}
  }else if(!speaking){floor=floor*.96+rms*.04}
  if(speaking&&now-lastVoice>1000){speaking=false;if(track)track.enabled=false;post('stop',0,{});updBtn()}
  else if(speaking&&now-hb>8000){hb=now;post('talk',0,{})}
}
async function arm(){
  if(!supported()){W().toast(W().t('micNo'),3500);return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
  }catch(e){W().toast(W().t('micDenied'),3500);return}
  track=stream.getAudioTracks()[0];track.enabled=false;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume().catch(()=>{});
    vtrack=track.clone();vtrack.enabled=true;
    const src=ac.createMediaStreamSource(new MediaStream([vtrack]));
    an=ac.createAnalyser();an.fftSize=512;src.connect(an);buf=new Float32Array(an.fftSize);
  }catch(e){}
  armed=true;floor=.008;
  vadT=setInterval(vad,70);
  W().toast(W().t('micOn'),2200);
  updBtn();reconcile();
}
function disarm(){
  armed=false;clearInterval(vadT);vadT=null;
  if(speaking){speaking=false;post('stop',0,{})}
  closeAllOut();
  try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}
  try{vtrack&&vtrack.stop()}catch(e){}
  try{ac&&ac.close()}catch(e){}
  stream=track=vtrack=ac=an=buf=null;
  W().toast(W().t('micOff'),1400);
  updBtn();
}

/* ---------- uyg'unlashtirish ---------- */
function reconcile(){
  if(!(ph==='day'||ph==='waiting')){closeAllIn();closeAllOut();return}
  if(!armed||!can){closeAllOut();return}
  const now=Date.now();
  const want=peers.slice(0,24);
  for(const u of want){
    if(outs.has(u))continue;
    if((retry.get(u)||0)>now)continue;
    openOut(u);
  }
  for(const [u,o] of [...outs]){
    if(!peers.includes(u))closeOut(u);
    else if(o.pc.connectionState!=='connected'&&now-o.t>16000){retry.set(u,now+3000);closeOut(u)}
  }
}
function setTalk(list){
  talk=new Set((list||[]).map(Number));
  try{window.Stage&&Stage.setTalking(talk)}catch(e){}
  const box=$('spk');if(!box)return;
  const V=W().S.V;const names=[];
  if(V)for(const p of V.players){if(talk.has(p.u))names.push(p.n)}
  box.innerHTML='';
  names.slice(0,3).forEach(n=>{const d=document.createElement('div');d.className='c';d.textContent='🎙 '+n;box.appendChild(d)});
}
function updBtn(){
  const b=$('bMic');if(!b)return;
  const V=W().S.V;
  const show=!!(V&&V.me&&V.me.in&&(V.phase==='day'||V.phase==='night')&&supported());
  b.classList.toggle('show',show);
  b.classList.toggle('on',armed);
  b.classList.toggle('live',armed&&speaking);
  b.classList.toggle('dis',!can&&!armed);
  b.textContent=armed?'🎙':'🎤';
}

/* ---------- uzun so'rov (signaling) ---------- */
async function loop(){
  if(polling)return;polling=true;
  const w=W();
  while(!w.S.gone){
    try{
      const u=w.API+'/api/wg/rtc?c='+w.CHAT+'&init_data='+encodeURIComponent(w.INIT)+'&since='+since+'&w=18&tv='+tv;
      const r=await fetch(u);const d=await r.json();
      if(!d||!d.ok){await sleep(3000);continue}
      if(d.ice&&d.ice.length)ICE=d.ice;
      for(const m of d.msgs||[]){if(m.i>since)since=m.i;await onMsg(m)}
      tv=d.tv;can=!!d.can;ph=d.ph;peers=d.peers||[];
      if(!can&&speaking){speaking=false;if(track)track.enabled=false}
      setTalk(d.talk);
      reconcile();updBtn();
    }catch(e){await sleep(2500)}
  }
  polling=false;
}

function boot(){
  const b=$('bMic');if(!b)return;
  b.onclick=()=>{
    W().hap();
    if(armed){disarm();return}
    const V=W().S.V;
    if(V&&V.me&&V.me.in&&!V.me.alive){W().toast(W().t('micDead'),2500);return}
    if(!can&&ph!=='day'){W().toast(W().t('micNight'),2500);if(!armed)return}
    arm();
  };
  setInterval(()=>{
    const V=W().S.V;
    if(V&&V.phase!=='waiting'&&V.phase!=='ended'&&!polling&&!W().S.gone)loop();
    if(V&&V.phase==='ended'&&armed)disarm();
    updBtn();
  },1500);
  document.addEventListener('visibilitychange',()=>{});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
window.Voice={arm,disarm,
  state:()=>({armed,speaking,can,ph,peers:peers.length,outs:outs.size,ins:ins.size,inConn:[...ins.values()].filter(o=>o.pc.connectionState==='connected').length}),
  rx:async()=>{let n=0;for(const o of ins.values()){try{const r=await o.pc.getStats();r.forEach(x=>{if(x.type==='inbound-rtp'&&x.kind==='audio')n+=x.bytesReceived||0})}catch(e){}}return n}};
})();
</script>
